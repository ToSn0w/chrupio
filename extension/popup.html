<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chrupio</title>
  <style>
    /* D1 tokens, light only: white, black, one orange; red only for errors. */
    @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url(fonts/IBMPlexMono-Regular.woff2) format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 700; src: url(fonts/IBMPlexMono-Bold.woff2) format("woff2"); }
    :root {
      color-scheme: light;
      --ink: #000000;
      --surface: #ffffff;
      --accent: #ff5b1f;
      --muted: #555555;
      --faint: #767676;
      --error: #b42318;
      --border: 3px;
      --border-heavy: 4px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 340px;
      font: 400 13px/1.45 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      background: var(--surface);
    }
    /* Black title bar like the app's Settings window: three orange squares, name, version. */
    header {
      display: flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 16px;
      background: var(--ink); color: var(--surface);
    }
    .sq { width: 12px; height: 12px; background: var(--accent); flex: none; }
    header h1 {
      margin: 0 0 0 10px; font-size: 14px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
    }
    .version { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--surface); }
    main { padding: 16px 20px 20px 16px; }
    section {
      background: var(--surface);
      border: var(--border-heavy) solid var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      padding: 14px;
    }
    section + section { margin-top: 16px; }
    /* Connection chip: orange fill with a black square when connected, white with "!" otherwise. */
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 28px; padding: 3px 10px;
      border: var(--border) solid var(--ink);
      background: var(--surface); color: var(--ink);
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .status:has(.dot.ok) { background: var(--accent); }
    .dot { display: none; flex: none; }
    .dot.ok { display: block; width: 9px; height: 9px; background: var(--ink); }
    .dot.bad { display: block; font-weight: 700; font-size: 13px; line-height: inherit; align-self: flex-start; }
    .dot.bad::before { content: "!"; }
    .status:has(.dot.refused) { color: var(--error); }
    .label {
      margin: 0 0 10px; font-size: 16px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .02em;
    }
    .meeting-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    li {
      display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px;
      border: var(--border) solid var(--ink); background: var(--surface);
      color: var(--ink); font-size: 12px; font-weight: 700;
    }
    li.self { background: var(--accent); }
    li.speaking { background: var(--ink); color: var(--surface); }
    .empty { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <span class="sq"></span><span class="sq"></span><span class="sq"></span>
    <h1>Chrupio</h1>
    <span id="version" class="version"></span>
  </header>
  <main>
  <section>
    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="conn">Checking app…</span>
    </div>
  </section>
  <section id="meeting">
    <div class="label">Current meeting</div>
    <div class="empty">No meeting detected</div>
  </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
