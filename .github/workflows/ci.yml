name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runs only on the public repository; the private one is skipped to save Actions minutes.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Package.swift needs Swift 6.2 (Xcode 26); the image default may be older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Swift version
        run: |
          swift --version
          swift --version 2>&1 | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])|[7-9]|[1-9][0-9])' || { echo "Swift 6.2 or newer is required"; exit 1; }
      - name: Build
        run: swift build
      - name: Swift tests
        run: swift test
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Extension tests
        run: node --test 'extension/tests/*.test.mjs'
      - name: Script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
